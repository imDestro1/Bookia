# Local MongoDB for development. Start with: docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: bookia-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - bookia-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bookia-mongo-data:
